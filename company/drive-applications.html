<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Applicants — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Company Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-company">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🏢</span> SPMS Recruiter
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#companyNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="companyNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="drives.html">💼 Placement Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="create-drive.html">➕ Create Drive</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">🏢 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <a href="drives.html" class="small text-decoration-none">← Back to Drives</a>
      <h2 class="mb-1" id="driveTitle">Drive Applicants</h2>
      <p class="text-muted mb-0" id="driveSubtitle">Review, download resumes, and shortlist candidates.</p>
    </div>
    <div class="d-flex gap-2">
      <a href="#" id="interviewsLink" class="btn btn-outline-primary btn-sm">🎙️ Manage Interviews</a>
      <a href="#" id="selectionsLink" class="btn btn-outline-success btn-sm">🏆 Make Offers</a>
    </div>
  </div>

  <div id="alertBox"></div>

  <!-- Filter -->
  <div class="card mb-4">
    <div class="card-body p-3">
      <div class="row g-2 align-items-center">
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="statusFilter" onchange="filterApplicants()">
            <option value="">All Applicant Statuses</option>
            <option value="applied">Applied (New)</option>
            <option value="shortlisted">Shortlisted</option>
            <option value="interview_scheduled">Interview Scheduled</option>
            <option value="selected">Selected</option>
            <option value="rejected">Rejected</option>
            <option value="withdrawn">Withdrawn</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="applicantsTable">
          <thead>
            <tr>
              <th>Student Details</th>
              <th>Academic Scores</th>
              <th>Skills</th>
              <th>Resume</th>
              <th>Status</th>
              <th class="text-end">Update Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['company']);

  const params  = new URLSearchParams(window.location.search);
  const driveId = params.get('id');
  if (!driveId) window.location.href = 'drives.html';

  document.getElementById('interviewsLink').href = `interviews.html?id=${driveId}`;
  document.getElementById('selectionsLink').href = `selections.html?id=${driveId}`;

  let allApplicants = [];

  const statusBadgeMap = {
    applied: 'badge-status-applied',
    shortlisted: 'badge-status-shortlisted',
    interview_scheduled: 'badge-status-interview',
    selected: 'badge-status-selected',
    rejected: 'badge-status-rejected',
    withdrawn: 'badge-status-withdrawn'
  };

  async function loadData() {
    try {
      const drRes = await apiRequest(`/drives/${driveId}`);
      document.getElementById('driveTitle').textContent = `Applicants: ${drRes.data.drive.title}`;

      const appRes = await apiRequest(`/drives/${driveId}/applications`);
      allApplicants = appRes.data?.applications || [];
      renderApplicants(allApplicants);
    } catch (err) {
      showAlert(err.message, 'danger');
      document.querySelector('#applicantsTable tbody').innerHTML = `
        <tr><td colspan="6" class="text-center text-muted py-4">Failed to load applicants.</td></tr>
      `;
    }
  }

  function filterApplicants() {
    const status = document.getElementById('statusFilter').value;
    const filtered = status ? allApplicants.filter(a => a.status === status) : allApplicants;
    renderApplicants(filtered);
  }

  function renderApplicants(apps) {
    const tbody = document.querySelector('#applicantsTable tbody');
    if (!apps.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="text-center text-muted py-5">
            <div class="fs-2 mb-2">👥</div>
            <h5>No applicants found for this filter.</h5>
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = apps.map(app => {
      // Fix resume URL resolution to prevent double prefix
      let resumeLinkHtml = '<span class="text-muted small">No Resume</span>';
      if (app.resume_url) {
        const fullUrl = apiAssetUrl(app.resume_url);
        resumeLinkHtml = `<a href="${fullUrl}" target="_blank" class="btn btn-sm btn-outline-primary">📄 View CV</a>`;
      }

      return `
        <tr>
          <td>
            <div class="fw-bold text-dark">${escHtml(app.student_name)}</div>
            <div class="small text-muted">${escHtml(app.student_email)}</div>
            <div class="small text-muted">Applied: ${formatDate(app.applied_at)}</div>
          </td>
          <td>
            <div class="small"><strong>Roll:</strong> ${escHtml(app.roll_number)}</div>
            <div class="small"><strong>Branch:</strong> ${escHtml(app.branch)}</div>
            <div class="small"><strong>CGPA:</strong> <span class="badge bg-light text-dark border">${app.cgpa}</span></div>
          </td>
          <td>
            <div style="max-width: 220px;">
              ${(app.skills && app.skills.length) 
                ? app.skills.map(s => `<span class="skill-chip">${escHtml(s)}</span>`).join('') 
                : '<span class="text-muted small">None listed</span>'}
            </div>
          </td>
          <td>${resumeLinkHtml}</td>
          <td>
            <span class="badge ${statusBadgeMap[app.status] || 'bg-secondary'} text-uppercase">
              ${escHtml(app.status.replace('_', ' '))}
            </span>
          </td>
          <td class="text-end">
            <select class="form-select form-select-sm d-inline-block w-auto"
                    onchange="changeStatus(${app.application_id}, this.value)"
                    ${app.status === 'withdrawn' ? 'disabled' : ''}>
              <option value="" disabled selected>Change Status...</option>
              ${app.status !== 'shortlisted' ? '<option value="shortlisted">✅ Shortlist</option>' : ''}
              ${app.status !== 'rejected' ? '<option value="rejected">❌ Reject</option>' : ''}
              ${app.status !== 'interview_scheduled' ? '<option value="interview_scheduled">🎙️ Mark Interview</option>' : ''}
              ${app.status !== 'selected' ? '<option value="selected">🏆 Select Candidate</option>' : ''}
            </select>
          </td>
        </tr>
      `;
    }).join('');
  }

  async function changeStatus(appId, newStatus) {
    if (!newStatus) return;
    try {
      await apiRequest(`/applications/${appId}/status`, {
        method: 'PATCH',
        body: { status: newStatus }
      });
      showAlert(`Applicant status updated to '${newStatus.replace('_', ' ')}'.`, 'success');
      await loadData();
    } catch (err) {
      showAlert(err.message, 'danger');
    }
  }

  loadData();
</script>
</body>
</html>
