<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Placement Drives — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Company Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-company">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🏢</span> SPMS Recruiter
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#companyNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="companyNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="drives.html">💼 Placement Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="create-drive.html">➕ Create Drive</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">🏢 <span id="navCompanyName">Profile</span></a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h2 class="mb-1">My Placement Drives</h2>
      <p class="text-muted mb-0">Create, track, and manage applications and interviews for your drives.</p>
    </div>
    <a href="create-drive.html" class="btn btn-primary shadow-sm">+ Post New Drive</a>
  </div>

  <div id="alertBox"></div>

  <!-- Status Filter -->
  <div class="card mb-4">
    <div class="card-body p-3">
      <div class="row align-items-center g-2">
        <div class="col-md-4">
          <select class="form-select" id="statusFilter" onchange="filterDrives()">
            <option value="">All Statuses</option>
            <option value="draft">Draft</option>
            <option value="pending_approval">Pending TPO Approval</option>
            <option value="approved">Approved & Open</option>
            <option value="rejected">Rejected by TPO</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Drives Container -->
  <div id="drivesContainer">
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="text-muted mt-2">Loading placement drives…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['company']);

  let allDrives = [];

  const statusBadgeMap = {
    draft: 'badge-status-draft',
    pending_approval: 'badge-status-pending',
    approved: 'badge-status-approved',
    rejected: 'badge-status-rejected',
    closed: 'badge-status-closed'
  };

  async function loadDrives() {
    try {
      // Load company profile for navbar
      const prof = await apiRequest('/companies/me');
      if (prof.data?.company?.company_name) {
        document.getElementById('navCompanyName').textContent = prof.data.company.company_name;
      }

      const res = await apiRequest('/drives/my');
      allDrives = res.data?.drives || [];
      renderDrives(allDrives);
    } catch (err) {
      showAlert(err.message, 'danger');
      document.getElementById('drivesContainer').innerHTML = '';
    }
  }

  function filterDrives() {
    const status = document.getElementById('statusFilter').value;
    const filtered = status ? allDrives.filter(d => d.status === status) : allDrives;
    renderDrives(filtered);
  }

  function renderDrives(drives) {
    const container = document.getElementById('drivesContainer');
    if (!drives.length) {
      container.innerHTML = `
        <div class="card p-5 text-center text-muted">
          <div class="fs-1 mb-2">💼</div>
          <h5>No placement drives found.</h5>
          <p>Create your first drive to start receiving applications from students!</p>
          <div>
            <a href="create-drive.html" class="btn btn-primary">+ Create Placement Drive</a>
          </div>
        </div>
      `;
      return;
    }

    container.innerHTML = drives.map(d => `
      <div class="card mb-3 shadow-sm animate-fade-in">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <div class="d-flex align-items-center gap-2 mb-1">
                <span class="badge ${statusBadgeMap[d.status] || 'bg-secondary'} text-uppercase">
                  ${escHtml(d.status.replace('_', ' '))}
                </span>
                <span class="text-muted small">ID: #${d.id}</span>
              </div>
              <h4 class="fw-bold text-dark mb-1">${escHtml(d.title)}</h4>
              <div class="text-muted small">
                <span class="badge bg-light text-dark border me-1">${escHtml((d.job_type || 'full_time').replace('_', ' ').toUpperCase())}</span>
                ${d.work_mode ? `<span class="badge bg-light text-dark border me-1">${escHtml(d.work_mode.replace('_', ' '))}</span>` : ''}
                ${d.location ? `<span>📍 ${escHtml(d.location)}</span>` : ''}
              </div>
            </div>
            <div class="text-end">
              <div class="fs-4 fw-bold text-success">${formatCurrency(d.package_ctc)}</div>
              <small class="text-muted">${d.num_openings || 1} Openings</small>
            </div>
          </div>

          <div class="row g-2 mt-3 pt-2 border-top">
            <div class="col-sm-3"><small class="text-muted d-block">Min CGPA</small><strong>${d.min_cgpa || 0}</strong></div>
            <div class="col-sm-3"><small class="text-muted d-block">Max Backlogs</small><strong>${d.max_backlogs || 0}</strong></div>
            <div class="col-sm-3"><small class="text-muted d-block">Total Applicants</small><strong class="text-primary fs-6">${d.applications_count || 0}</strong></div>
            <div class="col-sm-3"><small class="text-muted d-block">Deadline</small><strong class="text-danger">${formatDate(d.application_deadline)}</strong></div>
          </div>

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4 pt-2 border-top">
            <div class="d-flex gap-2 flex-wrap">
              <a href="drive-applications.html?id=${d.id}" class="btn btn-sm btn-primary">
                👥 View Applicants (${d.applications_count || 0})
              </a>
              <a href="interviews.html?id=${d.id}" class="btn btn-sm btn-outline-primary">
                🎙️ Interviews & Rounds
              </a>
              <a href="selections.html?id=${d.id}" class="btn btn-sm btn-outline-success">
                🏆 Selections & Offers
              </a>
            </div>

            <div class="d-flex gap-2">
              ${['draft', 'pending_approval'].includes(d.status) ? `
                <a href="edit-drive.html?id=${d.id}" class="btn btn-sm btn-outline-secondary">Edit</a>
              ` : ''}
              <a href="view-drive.html?id=${d.id}" class="btn btn-sm btn-outline-dark">View</a>
              ${d.status === 'draft' ? `
                <button class="btn btn-sm btn-outline-danger" onclick="deleteDraft(${d.id})">Delete</button>
              ` : ''}
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function deleteDraft(id) {
    if (!confirm('Are you sure you want to delete this draft drive?')) return;
    try {
      await apiRequest(`/drives/${id}`, { method: 'DELETE' });
      showAlert('Draft drive deleted.', 'info');
      await loadDrives();
    } catch (err) { showAlert(err.message); }
  }

  loadDrives();
</script>
</body>
</html>
