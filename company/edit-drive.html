<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Placement Drive — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Company Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-company">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🏢</span> SPMS Recruiter
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#companyNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="companyNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="drives.html">💼 Placement Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="create-drive.html">➕ Create Drive</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">🏢 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 860px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">Edit Placement Drive</h2>
      <p class="text-muted mb-0">Modify drive details, eligibility cutoffs, or deadlines.</p>
    </div>
    <a href="drives.html" class="btn btn-outline-secondary btn-sm">← Back to My Drives</a>
  </div>

  <div id="alertBox"></div>

  <form id="driveForm">
    <!-- Basic Info -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header fw-bold">1. Role & Job Description</div>
      <div class="card-body row g-3">
        <div class="col-12">
          <label class="form-label">Job Title <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="title" id="dTitle" required />
        </div>
        <div class="col-12">
          <label class="form-label">Description <span class="text-danger">*</span></label>
          <textarea class="form-control" name="description" id="dDescription" rows="4" required></textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">Job Type</label>
          <select class="form-select" name="job_type" id="dJobType">
            <option value="full_time">Full Time</option>
            <option value="internship">Internship</option>
            <option value="ppo">PPO</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Work Mode</label>
          <select class="form-select" name="work_mode" id="dWorkMode">
            <option value="on_site">On-site</option>
            <option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" name="location" id="dLocation" />
        </div>
        <div class="col-md-6">
          <label class="form-label">CTC (LPA)</label>
          <input type="number" class="form-control" name="package_ctc" id="dPackage" min="0" step="0.1" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Number of Openings</label>
          <input type="number" class="form-control" name="num_openings" id="dOpenings" min="1" />
        </div>
        <div class="col-12">
          <label class="form-label">Selection Process</label>
          <textarea class="form-control" name="selection_process" id="dProcess" rows="2"></textarea>
        </div>
      </div>
    </div>

    <!-- Eligibility -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header fw-bold">2. Eligibility Criteria</div>
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label">Eligible Course</label>
          <input type="text" class="form-control" name="eligible_course" id="dCourse" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Passing Year</label>
          <input type="number" class="form-control" name="passing_year" id="dPassingYear" min="2015" max="2035" />
        </div>
        <div class="col-12">
          <label class="form-label">Eligible Branches <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="eligible_branches_input" id="dBranches" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Min CGPA</label>
          <input type="number" class="form-control" name="min_cgpa" id="dMinCgpa" min="0" max="10" step="0.01" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Max Backlogs Allowed</label>
          <input type="number" class="form-control" name="max_backlogs" id="dMaxBacklogs" min="0" />
        </div>
        <div class="col-md-4"></div>
        <div class="col-md-6">
          <label class="form-label">Min 10th Percentage (%)</label>
          <input type="number" class="form-control" name="min_10th_percentage" id="d10th" min="0" max="100" step="0.01" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Min 12th Percentage (%)</label>
          <input type="number" class="form-control" name="min_12th_percentage" id="d12th" min="0" max="100" step="0.01" />
        </div>
        <div class="col-12">
          <label class="form-label">Required Skills</label>
          <input type="text" class="form-control" name="required_skills" id="dSkills" />
        </div>
      </div>
    </div>

    <!-- Dates -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header fw-bold">3. Schedule</div>
      <div class="card-body row g-3">
        <div class="col-md-4">
          <label class="form-label">Applications Open</label>
          <input type="datetime-local" class="form-control" name="application_start_date" id="dStartDate" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Application Deadline</label>
          <input type="datetime-local" class="form-control" name="application_deadline" id="dDeadline" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Drive Date</label>
          <input type="datetime-local" class="form-control" name="drive_date" id="dDriveDate" />
        </div>
      </div>
    </div>

    <div class="d-flex gap-3 mb-5">
      <button type="submit" class="btn btn-primary px-4 py-2" id="saveBtn">Save Changes</button>
      <a href="drives.html" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['company']);

  const params = new URLSearchParams(window.location.search);
  const driveId = params.get('id');
  if (!driveId) window.location.href = 'drives.html';

  function toDatetimeLocal(str) {
    if (!str) return '';
    return str.replace(' ', 'T').substring(0, 16);
  }

  async function loadDrive() {
    try {
      const res = await apiRequest(`/drives/${driveId}`);
      const d = res.data.drive;

      if (!['draft', 'pending_approval'].includes(d.status)) {
        showAlert(`This drive is in '${d.status}' status and cannot be modified.`, 'warning');
        document.querySelectorAll('#driveForm input, #driveForm textarea, #driveForm select, #saveBtn')
          .forEach(el => el.disabled = true);
        return;
      }

      document.getElementById('dTitle').value = d.title || '';
      document.getElementById('dDescription').value = d.description || '';
      document.getElementById('dJobType').value = d.job_type || 'full_time';
      document.getElementById('dWorkMode').value = d.work_mode || 'on_site';
      document.getElementById('dLocation').value = d.location || '';
      document.getElementById('dPackage').value = d.package_ctc || '';
      document.getElementById('dOpenings').value = d.num_openings || 1;
      document.getElementById('dProcess').value = d.selection_process || '';
      document.getElementById('dCourse').value = d.eligible_course || '';
      document.getElementById('dPassingYear').value = d.passing_year || '';
      document.getElementById('dBranches').value = (d.eligible_branches || []).join(', ');
      document.getElementById('dMinCgpa').value = d.min_cgpa || 0;
      document.getElementById('dMaxBacklogs').value = d.max_backlogs || 0;
      document.getElementById('d10th').value = d.min_10th_percentage || '';
      document.getElementById('d12th').value = d.min_12th_percentage || '';
      document.getElementById('dSkills').value = d.required_skills || '';
      document.getElementById('dStartDate').value = toDatetimeLocal(d.application_start_date);
      document.getElementById('dDeadline').value = toDatetimeLocal(d.application_deadline);
      document.getElementById('dDriveDate').value = toDatetimeLocal(d.drive_date);
    } catch (err) {
      showAlert(err.message, 'danger');
    }
  }

  document.getElementById('driveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;

    const fd = new FormData(e.target);
    const branchInput = fd.get('eligible_branches_input') || '';
    const branches = branchInput.split(',').map(s => s.trim()).filter(Boolean);

    const payload = {
      title:               fd.get('title'),
      description:         fd.get('description'),
      job_type:            fd.get('job_type'),
      work_mode:           fd.get('work_mode'),
      location:            fd.get('location') || null,
      package_ctc:         fd.get('package_ctc') ? Number(fd.get('package_ctc')) : null,
      num_openings:        Number(fd.get('num_openings')) || 1,
      selection_process:   fd.get('selection_process') || null,
      eligible_course:     fd.get('eligible_course') || null,
      passing_year:        fd.get('passing_year') ? Number(fd.get('passing_year')) : null,
      eligible_branches:   branches,
      min_cgpa:            Number(fd.get('min_cgpa')) || 0,
      max_backlogs:        Number(fd.get('max_backlogs')) || 0,
      min_10th_percentage: fd.get('min_10th_percentage') ? Number(fd.get('min_10th_percentage')) : null,
      min_12th_percentage: fd.get('min_12th_percentage') ? Number(fd.get('min_12th_percentage')) : null,
      required_skills:     fd.get('required_skills') || null,
      application_start_date: fd.get('application_start_date') ? fd.get('application_start_date').replace('T', ' ') + ':00' : null,
      application_deadline:   fd.get('application_deadline')   ? fd.get('application_deadline').replace('T', ' ') + ':00' : null,
      drive_date:          fd.get('drive_date') ? fd.get('drive_date').replace('T', ' ') + ':00' : null,
    };

    try {
      await apiRequest(`/drives/${driveId}`, { method: 'PUT', body: payload });
      showAlert('Drive updated successfully!', 'success');
      setTimeout(() => window.location.href = 'drives.html', 1200);
    } catch (err) {
      showAlert(err.message, 'danger');
      btn.disabled = false;
    }
  });

  loadDrive();
</script>
</body>
</html>
