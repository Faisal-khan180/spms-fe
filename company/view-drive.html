<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Summary — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Company Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-company">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🏢</span> SPMS Recruiter
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#companyNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="companyNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="drives.html">💼 Placement Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="create-drive.html">➕ Create Drive</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">🏢 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 860px;">
  <a href="drives.html" class="btn btn-sm btn-outline-secondary mb-3">← Back to My Drives</a>
  <div id="alertBox"></div>

  <div id="driveContent">
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="text-muted mt-2">Loading placement drive details…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['company']);

  const params  = new URLSearchParams(window.location.search);
  const driveId = params.get('id');
  if (!driveId) window.location.href = 'drives.html';

  const statusBadgeMap = {
    draft: 'badge-status-draft',
    pending_approval: 'badge-status-pending',
    approved: 'badge-status-approved',
    rejected: 'badge-status-rejected',
    closed: 'badge-status-closed'
  };

  async function loadDrive() {
    try {
      const res = await apiRequest(`/drives/${driveId}`);
      render(res.data.drive);
    } catch (err) {
      document.getElementById('driveContent').innerHTML = `
        <div class="alert alert-danger">${err.message}</div>
      `;
    }
  }

  function render(d) {
    const canEdit = ['draft', 'pending_approval'].includes(d.status);

    document.getElementById('driveContent').innerHTML = `
      <div class="card mb-4 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <span class="badge ${statusBadgeMap[d.status] || 'bg-secondary'} mb-2 text-uppercase">
                ${escHtml(d.status.replace('_', ' '))}
              </span>
              <h2 class="fw-bold mb-1">${escHtml(d.title)}</h2>
              <div class="text-muted">
                <span>${escHtml((d.job_type || 'full_time').replace('_', ' ').toUpperCase())}</span> ·
                <span>${escHtml(d.work_mode ? d.work_mode.replace('_', ' ') : 'On-site')}</span> ·
                <span>📍 ${escHtml(d.location || 'Location TBD')}</span>
              </div>
            </div>
            <div class="text-end">
              <div class="fs-2 fw-bold text-success">${formatCurrency(d.package_ctc)}</div>
              <small class="text-muted">${d.num_openings || 1} Openings</small>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header fw-bold">Job Description</div>
        <div class="card-body">
          <p class="mb-0" style="white-space: pre-line;">${escHtml(d.description)}</p>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header fw-bold">Eligibility Criteria</div>
        <div class="card-body p-0">
          <table class="table mb-0">
            <tbody>
              <tr><th style="width: 220px;">Eligible Course</th><td>${escHtml(d.eligible_course) || 'Any'}</td></tr>
              <tr><th>Eligible Branches</th><td>${(d.eligible_branches && d.eligible_branches.length) ? d.eligible_branches.map(escHtml).join(', ') : 'All Branches'}</td></tr>
              <tr><th>Min CGPA Required</th><td>${d.min_cgpa || 0}</td></tr>
              <tr><th>Max Backlogs Allowed</th><td>${d.max_backlogs || 0}</td></tr>
              <tr><th>Graduation Year</th><td>${d.passing_year || 'Any'}</td></tr>
              <tr><th>Min 10th %</th><td>${d.min_10th_percentage != null ? d.min_10th_percentage + '%' : 'No cutoff'}</td></tr>
              <tr><th>Min 12th %</th><td>${d.min_12th_percentage != null ? d.min_12th_percentage + '%' : 'No cutoff'}</td></tr>
              <tr>
                <th>Required Skills</th>
                <td>
                  ${d.required_skills ? d.required_skills.split(',').map(s=>`<span class="skill-chip">${escHtml(s.trim())}</span>`).join('') : '<span class="text-muted">None specified</span>'}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      ${d.selection_process ? `
        <div class="card mb-4">
          <div class="card-header fw-bold">Selection Process</div>
          <div class="card-body">
            <p class="mb-0" style="white-space: pre-line;">${escHtml(d.selection_process)}</p>
          </div>
        </div>
      ` : ''}

      <div class="card mb-4">
        <div class="card-header fw-bold">Schedule</div>
        <div class="card-body row g-3 text-center">
          <div class="col-md-4">
            <div class="p-3 bg-light rounded">
              <small class="text-muted d-block">Open Date</small>
              <strong>${formatDateTime(d.application_start_date)}</strong>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-light rounded">
              <small class="text-muted d-block">Deadline</small>
              <strong class="text-danger">${formatDateTime(d.application_deadline)}</strong>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-light rounded">
              <small class="text-muted d-block">Drive Date</small>
              <strong class="text-primary">${formatDateTime(d.drive_date)}</strong>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <a href="drive-applications.html?id=${d.id}" class="btn btn-primary">👥 View Applicants (${d.applications_count || 0})</a>
        <a href="interviews.html?id=${d.id}" class="btn btn-outline-primary">🎙️ Interviews</a>
        <a href="selections.html?id=${d.id}" class="btn btn-outline-success">🏆 Selections</a>
        ${canEdit ? `<a href="edit-drive.html?id=${d.id}" class="btn btn-outline-secondary">Edit Drive</a>` : ''}
      </div>
    `;
  }

  loadDrive();
</script>
</body>
</html>
