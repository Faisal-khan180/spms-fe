<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Smart Placement Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      background: #ffffff;
    }
    .auth-banner {
      background: var(--hero-gradient);
      padding: 2.25rem 1.5rem;
      text-align: center;
      color: #fff;
    }
    .signup-banner-box {
      background: #f1f5f9;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-banner">
    <div class="text-white text-decoration-none d-inline-flex align-items-center gap-2 mb-1">
      <span class="fs-4">🎓</span>
      <span class="h4 mb-0 fw-bold">SPMS Portal</span>
    </div>
    <p class="text-white-50 small mb-0">Smart Placement Management System</p>
  </div>

  <div class="p-4">
    <h5 class="fw-bold mb-3 text-center">Sign In to Your Account</h5>
    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" class="form-control" name="email" id="emailInput" required
          placeholder="your.email@university.edu" autocomplete="email" />
      </div>
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label fw-semibold mb-0">Password</label>
        </div>
        <div class="input-group">
          <input type="password" class="form-control" name="password" id="passwordInput" required
            placeholder="••••••••" autocomplete="current-password" />
          <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold" id="loginBtn">
        Sign In to Portal →
      </button>
    </form>

    <!-- Sign Up Option -->
    <div class="signup-banner-box p-3 text-center mt-4">
      <div class="small text-muted mb-2 fw-medium">Don't have an account yet?</div>
      <a href="register.html" class="btn btn-outline-primary btn-sm w-100 fw-bold py-2">
        ✨ Sign Up / Create New Account
      </a>
    </div>

    <!-- Quick Demo Accounts Switcher -->
    <div class="mt-4 pt-3 border-top">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <small class="fw-bold text-muted text-uppercase">Demo Credentials</small>
        <small class="text-muted">Password: <code>Password@123</code></small>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-sm btn-outline-danger flex-grow-1" onclick="fillDemo('admin@spms.edu')">
          Admin
        </button>
        <button type="button" class="btn btn-sm btn-outline-primary flex-grow-1" onclick="fillDemo('hr@technova.example.com')">
          Company
        </button>
        <button type="button" class="btn btn-sm btn-outline-success flex-grow-1" onclick="fillDemo('aarav.sharma@student.spms.edu')">
          Student
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  // Check for registration success or redirect parameters
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered') === 'true') {
      showAlert('Account registered successfully! Please sign in with your credentials.', 'success');
      const email = params.get('email');
      if (email) {
        document.getElementById('emailInput').value = decodeURIComponent(email);
        document.getElementById('passwordInput').focus();
      }
    } else if (params.get('reason') === 'unauthorized') {
      showAlert('Please sign in to access that page.', 'warning');
    }
  });

  function togglePasswordVisibility() {
    const input = document.getElementById('passwordInput');
    const btn = document.getElementById('togglePasswordBtn');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁️';
    }
  }

  function redirectToRoleDashboard(role, vStatus) {
    if (role === 'admin')        window.location.href = 'admin/dashboard.html';
    else if (role === 'company') window.location.href = 'company/drives.html';
    else if (role === 'student') {
      if (vStatus && vStatus !== 'approved') {
        window.location.href = 'student/verification-pending.html';
      } else {
        window.location.href = 'student/drives.html';
      }
    }
    else window.location.href = 'login.html';
  }

  function fillDemo(email) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = 'Password@123';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const fd = new FormData(e.target);
    try {
      const data = await apiRequest('/auth/login', {
        method: 'POST',
        body: {
          email:    fd.get('email'),
          password: fd.get('password')
        },
        auth: false
      });

      const user = data.data.user;
      localStorage.setItem('token', data.data.token);
      localStorage.setItem('role',  user.role);
      localStorage.setItem('userId', user.id);
      localStorage.setItem('userName', user.name);
      if (user.verification_status) {
        localStorage.setItem('verification_status', user.verification_status);
      }

      if (user.role === 'student' && user.verification_status && user.verification_status !== 'approved') {
        showAlert('Login successful. Redirecting to verification status…', 'warning');
      } else {
        showAlert('Login successful! Redirecting to Dashboard…', 'success');
      }

      setTimeout(() => redirectToRoleDashboard(user.role, user.verification_status), 600);
    } catch (err) {
      showAlert(err.message, 'danger');
      btn.disabled = false;
      btn.textContent = 'Sign In to Portal →';
    }
  });
</script>
</body>
</html>
