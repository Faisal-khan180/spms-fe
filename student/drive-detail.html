<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Details — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Student Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-student">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🎓</span> SPMS Student
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="studentNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="drives.html">💼 Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="recommended.html">⭐ Recommended</a></li>
        <li class="nav-item"><a class="nav-link" href="applications.html">📄 Applications</a></li>
        <li class="nav-item"><a class="nav-link" href="interviews.html">🎙️ Interviews</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">🏆 Offers</a></li>
        <li class="nav-item">
          <a class="nav-link" href="notifications.html">
            🔔 Notifications <span class="badge bg-danger rounded-pill ms-1" id="unreadNotifBadge" style="display:none;">0</span>
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 900px;">
  <a href="drives.html" class="btn btn-sm btn-outline-secondary mb-3">← Back to Drives</a>
  <div id="alertBox"></div>

  <div id="driveContent">
    <div class="text-center py-5">
      <div class="spinner-border text-success"></div>
      <p class="text-muted mt-2">Loading placement drive details…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['student']);

  const params  = new URLSearchParams(window.location.search);
  const driveId = params.get('id');

  if (!driveId) {
    window.location.href = 'drives.html';
  }

  async function loadDriveDetail() {
    try {
      const res = await apiRequest(`/drives/${driveId}`);
      renderDrive(res.data.drive);
      updateNotificationBadge();
    } catch (err) {
      document.getElementById('driveContent').innerHTML = `
        <div class="alert alert-danger">${err.message}</div>
      `;
    }
  }

  function renderDrive(d) {
    document.getElementById('driveContent').innerHTML = `
      <!-- Header Banner -->
      <div class="card mb-4 border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
              <span class="badge bg-success mb-2 text-uppercase">${escHtml(d.status)}</span>
              <h2 class="fw-bold mb-1">${escHtml(d.title)}</h2>
              <h5 class="text-muted fw-semibold mb-2">${escHtml(d.company_name)}</h5>
              <div class="d-flex gap-3 text-muted small flex-wrap">
                <span>🏢 ${escHtml(d.industry || 'Industry TBD')}</span>
                ${d.website ? `<span>🌐 <a href="${escHtml(d.website)}" target="_blank">${escHtml(d.website)}</a></span>` : ''}
                ${d.location ? `<span>📍 ${escHtml(d.location)}</span>` : ''}
              </div>
            </div>
            <div class="text-end">
              <div class="fs-2 fw-bold text-success">${formatCurrency(d.package_ctc)}</div>
              <span class="badge bg-light text-dark border">${escHtml((d.job_type||'full_time').replace('_', ' ').toUpperCase())}</span>
              ${d.work_mode ? `<span class="badge bg-light text-dark border">${escHtml(d.work_mode.replace('_', ' '))}</span>` : ''}
            </div>
          </div>
        </div>
      </div>

      <!-- Eligibility Card & Apply CTA -->
      <div class="card mb-4" id="eligibilityCard">
        <div class="card-header fw-bold d-flex justify-content-between align-items-center">
          <span>🎯 Your Eligibility Evaluation</span>
          <a href="profile.html" class="small text-decoration-none">Update Profile</a>
        </div>
        <div class="card-body" id="eligibilityResult">
          <div class="text-center py-3 text-muted">
            <div class="spinner-border spinner-border-sm text-success me-2"></div>
            Evaluating your profile against drive requirements…
          </div>
        </div>
      </div>

      <!-- Role Description -->
      <div class="card mb-4">
        <div class="card-header fw-bold">Job Description & Responsibilities</div>
        <div class="card-body">
          <p class="mb-0" style="white-space: pre-line;">${escHtml(d.description)}</p>
        </div>
      </div>

      <!-- Criteria Table -->
      <div class="card mb-4">
        <div class="card-header fw-bold">Academic & Eligibility Criteria</div>
        <div class="card-body p-0">
          <table class="table mb-0">
            <tbody>
              <tr><th style="width: 240px;">Eligible Degree / Course</th><td>${escHtml(d.eligible_course) || 'Any Course'}</td></tr>
              <tr><th>Eligible Branches</th><td>${(d.eligible_branches && d.eligible_branches.length) ? d.eligible_branches.map(escHtml).join(', ') : 'All Branches Eligible'}</td></tr>
              <tr><th>Graduation / Passing Year</th><td>${d.passing_year ? d.passing_year : 'Any'}</td></tr>
              <tr><th>Minimum CGPA Required</th><td><strong class="text-primary">${d.min_cgpa || 0}</strong></td></tr>
              <tr><th>Maximum Active Backlogs</th><td>${d.max_backlogs || 0}</td></tr>
              <tr><th>Minimum 10th Percentage</th><td>${d.min_10th_percentage != null ? d.min_10th_percentage + '%' : 'No cutoff'}</td></tr>
              <tr><th>Minimum 12th / Diploma %</th><td>${d.min_12th_percentage != null ? d.min_12th_percentage + '%' : 'No cutoff'}</td></tr>
              <tr><th>Number of Openings</th><td>${d.num_openings || 1} Position(s)</td></tr>
              <tr>
                <th>Required Skills</th>
                <td>
                  ${d.required_skills 
                    ? d.required_skills.split(',').map(s => `<span class="skill-chip">${escHtml(s.trim())}</span>`).join('') 
                    : '<span class="text-muted">None specified</span>'}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      ${d.selection_process ? `
        <div class="card mb-4">
          <div class="card-header fw-bold">Selection Process / Interview Rounds</div>
          <div class="card-body">
            <p class="mb-0" style="white-space: pre-line;">${escHtml(d.selection_process)}</p>
          </div>
        </div>
      ` : ''}

      <!-- Timeline / Schedule -->
      <div class="card mb-4">
        <div class="card-header fw-bold">Important Dates</div>
        <div class="card-body">
          <div class="row g-3 text-center">
            <div class="col-md-4">
              <div class="p-3 bg-light rounded">
                <small class="text-muted d-block">Applications Open</small>
                <strong>${formatDateTime(d.application_start_date)}</strong>
              </div>
            </div>
            <div class="col-md-4">
              <div class="p-3 bg-light rounded">
                <small class="text-muted d-block">Application Deadline</small>
                <strong class="text-danger">${formatDateTime(d.application_deadline)}</strong>
              </div>
            </div>
            <div class="col-md-4">
              <div class="p-3 bg-light rounded">
                <small class="text-muted d-block">Drive Date</small>
                <strong class="text-primary">${formatDateTime(d.drive_date)}</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    checkEligibilityStatus(d.id);
  }

  async function checkEligibilityStatus(id) {
    const resultBox = document.getElementById('eligibilityResult');

    try {
      // 1. Fetch Eligibility
      const eligRes = await apiRequest(`/drives/${id}/eligibility`);
      const elig = eligRes.data;

      // 2. Fetch My Applications
      const appRes = await apiRequest('/applications/my');
      const myApps = appRes.data?.applications || [];
      const currentApp = myApps.find(a => String(a.drive_id) === String(id));

      if (currentApp) {
        const badgeClass = currentApp.status === 'selected' ? 'bg-success' :
                           currentApp.status === 'rejected' ? 'bg-danger' :
                           currentApp.status === 'withdrawn' ? 'bg-secondary' : 'bg-primary';

        resultBox.innerHTML = `
          <div class="alert alert-info d-flex justify-content-between align-items-center mb-0">
            <div>
              <h5 class="alert-heading mb-1">🎉 You have applied for this drive</h5>
              <p class="mb-0 small">Applied on: ${formatDateTime(currentApp.applied_at)}</p>
            </div>
            <div>
              <span class="badge ${badgeClass} fs-6 text-uppercase">${escHtml(currentApp.status.replace('_', ' '))}</span>
            </div>
          </div>
        `;
      } else if (elig.eligible) {
        resultBox.innerHTML = `
          <div class="p-2">
            <div class="d-flex align-items-center gap-2 text-success fs-5 fw-bold mb-2">
              <span>✅</span> You meet all eligibility criteria for this drive!
            </div>
            <p class="text-muted mb-3">Your academic profile, department, and score meet or exceed all recruiter requirements.</p>

            ${elig.matchedSkills && elig.matchedSkills.length > 0 ? `
              <div class="mb-3">
                <strong class="small text-muted d-block mb-1">Matched Skills:</strong>
                ${elig.matchedSkills.map(s => `<span class="skill-chip skill-match">✓ ${escHtml(s)}</span>`).join('')}
              </div>
            ` : ''}

            <div class="pt-2">
              <button class="btn btn-success btn-lg px-4" onclick="applyToDrive(${id})" id="applyBtn">
                Apply for this Drive Now →
              </button>
            </div>
          </div>
        `;
      } else {
        resultBox.innerHTML = `
          <div class="p-2">
            <div class="d-flex align-items-center gap-2 text-danger fs-5 fw-bold mb-2">
              <span>❌</span> You are currently not eligible for this drive
            </div>
            <div class="mb-3">
              <strong class="small text-muted d-block mb-1">Criteria Not Met:</strong>
              <ul class="mb-0 text-danger ps-3">
                ${elig.reasons.map(r => `<li>${escHtml(r)}</li>`).join('')}
              </ul>
            </div>

            ${(elig.matchedSkills?.length || elig.missingSkills?.length) ? `
              <div class="mt-3">
                <strong class="small text-muted d-block mb-1">Skill Matching:</strong>
                ${elig.matchedSkills.map(s => `<span class="skill-chip skill-match">✓ ${escHtml(s)}</span>`).join('')}
                ${elig.missingSkills.map(s => `<span class="skill-chip skill-miss">✗ ${escHtml(s)}</span>`).join('')}
              </div>
            ` : ''}

            <div class="mt-3">
              <a href="profile.html" class="btn btn-outline-primary btn-sm">Update My Profile Details</a>
            </div>
          </div>
        `;
      }
    } catch (err) {
      resultBox.innerHTML = `<div class="alert alert-danger mb-0">${err.message}</div>`;
    }
  }

  async function applyToDrive(id) {
    const btn = document.getElementById('applyBtn');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Submitting Application…';
    }

    try {
      await apiRequest('/applications', {
        method: 'POST',
        body: { drive_id: id }
      });
      showAlert('Application submitted successfully! Good luck!', 'success');
      setTimeout(() => loadDriveDetail(), 1000);
    } catch (err) {
      showAlert(err.message, 'danger');
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Apply for this Drive Now →';
      }
    }
  }

  loadDriveDetail();
</script>
</body>
</html>
