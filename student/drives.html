<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Placement Drives — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Student Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-student">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🎓</span> SPMS Student
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="studentNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="drives.html">💼 Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="recommended.html">⭐ Recommended</a></li>
        <li class="nav-item"><a class="nav-link" href="applications.html">📄 Applications</a></li>
        <li class="nav-item"><a class="nav-link" href="interviews.html">🎙️ Interviews</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">🏆 Offers</a></li>
        <li class="nav-item">
          <a class="nav-link" href="notifications.html">
            🔔 Notifications <span class="badge bg-danger rounded-pill ms-1" id="unreadNotifBadge" style="display:none;">0</span>
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h2 class="mb-1">Active Placement Drives</h2>
      <p class="text-muted mb-0">Browse university-approved recruitment opportunities.</p>
    </div>
    <a href="recommended.html" class="btn btn-success">
      ⭐ View Recommended For You
    </a>
  </div>

  <div id="alertBox"></div>

  <!-- Search and Filters -->
  <div class="card mb-4">
    <div class="card-body p-3">
      <div class="row g-2">
        <div class="col-md-5">
          <input type="text" class="form-control" id="searchInput" placeholder="Search by role title, keyword, company…" oninput="filterDrives()" />
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" id="branchFilter" placeholder="Filter by branch…" oninput="filterDrives()" />
        </div>
        <div class="col-md-4">
          <select class="form-select" id="jobTypeFilter" onchange="filterDrives()">
            <option value="">All Job Types</option>
            <option value="full_time">Full Time</option>
            <option value="internship">Internship</option>
            <option value="ppo">PPO (Pre-Placement Offer)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Drives Container -->
  <div id="drivesContainer">
    <div class="text-center py-5">
      <div class="spinner-border text-success"></div>
      <p class="text-muted mt-2">Loading placement drives…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['student']);

  let allDrives = [];

  async function loadDrives() {
    try {
      const res = await apiRequest('/drives');
      allDrives = res.data.drives || [];
      renderDrives(allDrives);
      updateNotificationBadge();
    } catch (err) {
      showAlert(err.message, 'danger');
      document.getElementById('drivesContainer').innerHTML = '';
    }
  }

  function filterDrives() {
    const search  = document.getElementById('searchInput').value.toLowerCase().trim();
    const branch  = document.getElementById('branchFilter').value.toLowerCase().trim();
    const jobType = document.getElementById('jobTypeFilter').value;

    const filtered = allDrives.filter(d => {
      const matchSearch = !search ||
        (d.title && d.title.toLowerCase().includes(search)) ||
        (d.company_name && d.company_name.toLowerCase().includes(search)) ||
        (d.required_skills && d.required_skills.toLowerCase().includes(search));

      const matchBranch = !branch ||
        (d.eligible_branches && d.eligible_branches.some(b => b.toLowerCase().includes(branch)));

      const matchJob = !jobType || d.job_type === jobType;

      return matchSearch && matchBranch && matchJob;
    });

    renderDrives(filtered);
  }

  function renderDrives(drives) {
    const container = document.getElementById('drivesContainer');
    if (!drives.length) {
      container.innerHTML = `
        <div class="card p-5 text-center text-muted">
          <h5>No placement drives match your filter.</h5>
          <p class="mb-0">Try clearing your search terms or checking back later.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = drives.map(d => `
      <div class="card drive-card mb-3 animate-fade-in" onclick="window.location.href='drive-detail.html?id=${d.id}'">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <h5 class="mb-1 text-primary fw-bold">${escHtml(d.title)}</h5>
              <div class="fw-semibold text-dark">${escHtml(d.company_name)}</div>
              <div class="text-muted small mt-1">
                <span class="badge bg-light text-dark border me-1">${escHtml((d.job_type || 'full_time').replace('_', ' ').toUpperCase())}</span>
                ${d.work_mode ? `<span class="badge bg-light text-dark border me-1">${escHtml(d.work_mode.replace('_', ' '))}</span>` : ''}
                ${d.location ? `<span>📍 ${escHtml(d.location)}</span>` : ''}
              </div>
            </div>
            <div class="text-end">
              <div class="fs-4 fw-bold text-success">${formatCurrency(d.package_ctc)}</div>
              <small class="text-muted">${d.num_openings || 1} Position${(d.num_openings || 1) > 1 ? 's' : ''}</small>
            </div>
          </div>

          <div class="row g-2 mt-2">
            <div class="col-auto"><span class="badge bg-light text-secondary border">Min CGPA: ${d.min_cgpa || 0}</span></div>
            <div class="col-auto"><span class="badge bg-light text-secondary border">Max Backlogs: ${d.max_backlogs || 0}</span></div>
            ${d.eligible_course ? `<div class="col-auto"><span class="badge bg-light text-secondary border">Course: ${escHtml(d.eligible_course)}</span></div>` : ''}
            ${d.passing_year ? `<div class="col-auto"><span class="badge bg-light text-secondary border">Batch: ${d.passing_year}</span></div>` : ''}
          </div>

          ${d.required_skills ? `
            <div class="mt-2">
              <small class="text-muted fw-semibold">Skills: </small>
              ${d.required_skills.split(',').map(s => `<span class="skill-chip">${escHtml(s.trim())}</span>`).join('')}
            </div>
          ` : ''}

          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <small class="text-muted">
              ${d.application_deadline ? `⏰ Deadline: <strong class="text-danger">${formatDateTime(d.application_deadline)}</strong>` : 'Open Applications'}
            </small>
            <span class="btn btn-sm btn-outline-success">Check Eligibility & Apply →</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  loadDrives();
</script>
</body>
</html>
