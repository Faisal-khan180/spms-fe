<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- Student Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-student">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🎓</span> SPMS Student
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="studentNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="drives.html">💼 Drives</a></li>
        <li class="nav-item"><a class="nav-link" href="recommended.html">⭐ Recommended</a></li>
        <li class="nav-item"><a class="nav-link" href="applications.html">📄 Applications</a></li>
        <li class="nav-item"><a class="nav-link active" href="interviews.html">🎙️ Interviews</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">🏆 Offers</a></li>
        <li class="nav-item">
          <a class="nav-link" href="notifications.html">
            🔔 Notifications <span class="badge bg-danger rounded-pill ms-1" id="unreadNotifBadge" style="display:none;">0</span>
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 900px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">My Scheduled Interviews</h2>
      <p class="text-muted mb-0">Interview rounds, schedule timings, and feedback from recruiters.</p>
    </div>
  </div>

  <div id="alertBox"></div>

  <div id="interviewsList">
    <div class="text-center py-5">
      <div class="spinner-border text-success"></div>
      <p class="text-muted mt-2">Loading your interviews…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['student']);

  async function loadInterviews() {
    try {
      const res = await apiRequest('/interviews/my');
      renderInterviews(res.data?.interviews || []);
      updateNotificationBadge();
    } catch (err) {
      showAlert(err.message, 'danger');
      document.getElementById('interviewsList').innerHTML = '';
    }
  }

  const resultBadgeMap = {
    scheduled: 'bg-primary',
    pass: 'bg-success',
    fail: 'bg-danger',
    absent: 'bg-secondary'
  };

  function renderInterviews(interviews) {
    const container = document.getElementById('interviewsList');
    if (!interviews.length) {
      container.innerHTML = `
        <div class="card p-5 text-center text-muted">
          <div class="fs-1 mb-2">🎙️</div>
          <h5>No interviews scheduled yet.</h5>
          <p class="mb-0">When companies shortlist your profile and assign interview rounds, they will appear here.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = interviews.map(i => `
      <div class="card mb-3 shadow-sm animate-fade-in">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
              <span class="badge ${resultBadgeMap[i.status] || 'bg-secondary'} mb-1 text-uppercase">
                ${escHtml(i.status)}
              </span>
              <h5 class="fw-bold text-dark mb-0">${escHtml(i.drive_title)}</h5>
              <div class="fw-semibold text-primary">${escHtml(i.company_name)}</div>
            </div>
            <div class="text-end">
              <span class="badge bg-light text-dark border fs-6">Round ${i.round_number}: ${escHtml(i.round_name)}</span>
            </div>
          </div>

          <div class="row g-2 mt-3 pt-2 border-top">
            <div class="col-md-6">
              <small class="text-muted d-block">Scheduled Timing</small>
              <strong>📅 ${formatDateTime(i.scheduled_date)}</strong>
            </div>
            <div class="col-md-6">
              <small class="text-muted d-block">Interviewer</small>
              <span>${escHtml(i.interviewer_name || 'Assigned by HR')}</span>
            </div>
          </div>

          ${i.feedback ? `
            <div class="mt-3 p-3 bg-light rounded border">
              <strong class="small text-dark d-block">Recruiter Feedback:</strong>
              <small class="text-muted">${escHtml(i.feedback)}</small>
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  loadInterviews();
</script>
</body>
</html>
