</head>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

<div class="container py-4" style="max-width: 800px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">🔔 My Notifications</h2>
      <p class="text-muted mb-0">Placement announcements, interview alerts, and status updates.</p>
    </div>
    <button class="btn btn-sm btn-outline-secondary" onclick="markAllAsRead()">
      ✓ Mark All Read
    </button>
  </div>

  <div id="alertBox"></div>

  <div class="card shadow-sm">
    <div class="card-body p-0" id="notificationsList">
      <div class="text-center py-5">
        <div class="spinner-border text-success"></div>
        <p class="text-muted mt-2">Loading notifications…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['student']);

  async function loadNotifications() {
    try {
      const res = await apiRequest('/notifications/my');
      renderNotifications(res.data?.notifications || []);
      updateNotificationBadge();
    } catch (err) {
      showAlert(err.message, 'danger');
      document.getElementById('notificationsList').innerHTML = '';
    }
  }

  function renderNotifications(notifs) {
    const container = document.getElementById('notificationsList');
    if (!notifs.length) {
      container.innerHTML = `
        <div class="p-5 text-center text-muted">
          <div class="fs-1 mb-2">🔔</div>
          <h5>No notifications found.</h5>
          <p class="mb-0">You're all caught up!</p>
        </div>
      `;
      return;
    }

    container.innerHTML = notifs.map(n => `
      <div class="notification-item ${!n.is_read ? 'unread' : ''} d-flex justify-content-between align-items-start gap-3">
        <div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <h6 class="fw-bold mb-0 text-dark">${escHtml(n.title)}</h6>
            ${!n.is_read ? '<span class="badge bg-success rounded-pill" style="font-size:0.65rem;">NEW</span>' : ''}
          </div>
          <p class="mb-1 text-muted small">${escHtml(n.message)}</p>
          <small class="text-light text-muted">${formatDateTime(n.created_at)}</small>
        </div>
        <div>
          ${!n.is_read ? `
            <button class="btn btn-xs btn-outline-success" onclick="markRead(${n.id})" title="Mark as read">✓</button>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  async function markRead(id) {
    try {
      await apiRequest(`/notifications/${id}/read`, { method: 'PATCH' });
      await loadNotifications();
    } catch (err) { showAlert(err.message); }
  }

  async function markAllAsRead() {
    try {
      await apiRequest('/notifications/read-all', { method: 'PATCH' });
      showAlert('All notifications marked as read.', 'success');
      await loadNotifications();
    } catch (err) { showAlert(err.message); }
  }

  loadNotifications();
</script>
</body>
</html>
