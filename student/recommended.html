<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended Drives — SPMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .rank-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<!-- Student Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark spms-navbar navbar-student">
  <div class="container">
    <a class="navbar-brand" href="drives.html">
      <span>🎓</span> SPMS Student
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="studentNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="drives.html">💼 Drives</a></li>
        <li class="nav-item"><a class="nav-link active" href="recommended.html">⭐ Recommended</a></li>
        <li class="nav-item"><a class="nav-link" href="applications.html">📄 Applications</a></li>
        <li class="nav-item"><a class="nav-link" href="interviews.html">🎙️ Interviews</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">🏆 Offers</a></li>
        <li class="nav-item">
          <a class="nav-link" href="notifications.html">
            🔔 Notifications <span class="badge bg-danger rounded-pill ms-1" id="unreadNotifBadge" style="display:none;">0</span>
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h2 class="mb-1">⭐ Recommended Drives For You</h2>
      <p class="text-muted mb-0">Active placement drives where you are 100% eligible, sorted by skill match.</p>
    </div>
    <a href="drives.html" class="btn btn-outline-secondary">Browse All Drives</a>
  </div>

  <div id="alertBox"></div>

  <div id="recommendedContainer">
    <div class="text-center py-5">
      <div class="spinner-border text-success"></div>
      <p class="text-muted mt-2">Computing recommended opportunities…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  requireAuth(['student']);

  async function loadRecommended() {
    try {
      const res = await apiRequest('/students/recommended-drives');
      renderRecommended(res.data?.recommended_drives || []);
      updateNotificationBadge();
    } catch (err) {
      showAlert(err.message, 'danger');
      document.getElementById('recommendedContainer').innerHTML = '';
    }
  }

  function getMatchBadge(pct) {
    if (pct === 100) return 'bg-success';
    if (pct >= 60) return 'bg-primary';
    return 'bg-warning text-dark';
  }

  function renderRecommended(items) {
    const container = document.getElementById('recommendedContainer');
    if (!items.length) {
      container.innerHTML = `
        <div class="card p-5 text-center text-muted">
          <div class="fs-1 mb-2">⭐</div>
          <h5>No recommended drives found at this moment.</h5>
          <p>This may happen if your profile is missing skills, or active drives have not opened for your branch yet.</p>
          <div>
            <a href="profile.html" class="btn btn-success me-2">Complete Profile & Skills</a>
            <a href="drives.html" class="btn btn-outline-secondary">Browse All Drives</a>
          </div>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="alert alert-success py-2 px-3 small mb-3">
        🎯 Found <strong>${items.length}</strong> matching drive${items.length > 1 ? 's' : ''} where you meet all eligibility requirements!
      </div>
    ` + items.map((item, idx) => {
      const d = item.drive;
      const e = item.eligibility;
      const matchPct = e.skillMatchPercentage || 0;

      return `
        <div class="card drive-card mb-3 animate-fade-in" onclick="window.location.href='drive-detail.html?id=${d.id}'">
          <div class="card-body">
            <div class="d-flex gap-3 align-items-start">
              <div class="rank-badge ${getMatchBadge(matchPct)} text-white flex-shrink-0">
                #${idx + 1}
              </div>

              <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                  <div>
                    <h5 class="mb-1 text-primary fw-bold">${escHtml(d.title)}</h5>
                    <div class="fw-semibold text-dark">${escHtml(d.company_name)}</div>
                    <div class="text-muted small mt-1">
                      <span class="badge bg-light text-dark border me-1">${escHtml((d.job_type || 'full_time').replace('_', ' ').toUpperCase())}</span>
                      ${d.work_mode ? `<span class="badge bg-light text-dark border me-1">${escHtml(d.work_mode.replace('_', ' '))}</span>` : ''}
                      ${d.location ? `<span>📍 ${escHtml(d.location)}</span>` : ''}
                    </div>
                  </div>
                  <div class="text-end">
                    <div class="fs-4 fw-bold text-success">${formatCurrency(d.package_ctc)}</div>
                    <span class="badge ${getMatchBadge(matchPct)}">
                      ${matchPct}% Skill Match
                    </span>
                  </div>
                </div>

                <!-- Skill Matching Breakdown -->
                <div class="mt-2">
                  ${(e.matchedSkills && e.matchedSkills.length) ? `
                    <div class="small mb-1">
                      <span class="text-success fw-semibold">Matched Skills:</span>
                      ${e.matchedSkills.map(s => `<span class="skill-chip skill-match">✓ ${escHtml(s)}</span>`).join('')}
                    </div>
                  ` : ''}
                  ${(e.missingSkills && e.missingSkills.length) ? `
                    <div class="small">
                      <span class="text-muted fw-semibold">Skills you could learn:</span>
                      ${e.missingSkills.map(s => `<span class="skill-chip skill-miss">✗ ${escHtml(s)}</span>`).join('')}
                    </div>
                  ` : ''}
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                  <small class="text-muted">
                    ${d.application_deadline ? `⏰ Deadline: <strong class="text-danger">${formatDateTime(d.application_deadline)}</strong>` : 'Open Applications'}
                  </small>
                  <span class="btn btn-sm btn-success">View Details & Apply →</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  loadRecommended();
</script>
</body>
</html>
